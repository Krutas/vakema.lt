<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VAKEMA — Cinematic Review v2</title><style>:root{--g:#d8ad57}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.stage{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#050505}.scene{position:absolute;inset:-3%;background-position:center;background-size:cover;background-repeat:no-repeat;transform:translate3d(var(--x,0),var(--y,0),0) scale(1.045);transition:opacity .45s ease,transform .12s linear;will-change:transform;opacity:0}.loaded .scene{opacity:1}.glass{position:absolute;top:-20%;height:140%;width:9%;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);filter:blur(2px);transform:skewX(-14deg);mix-blend-mode:screen;opacity:.28;animation:sweep 13s ease-in-out infinite}.g1{left:56%}.g2{left:76%;animation-delay:-5.5s;opacity:.14}@keyframes sweep{50%{translate:90px 0}}.edge{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.18)}.badge{position:absolute;z-index:5;left:18px;bottom:16px;padding:8px 10px;border:1px solid rgba(255,255,255,.16);background:rgba(4,4,4,.5);backdrop-filter:blur(10px);color:#d2cdc3;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.badge:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:9px;background:var(--g);box-shadow:0 0 12px var(--g)}.load{position:absolute;inset:0;display:grid;place-items:center;color:#a89e8c;font-size:10px;letter-spacing:.24em;text-transform:uppercase}.loaded .load{display:none}@media(max-width:900px){.scene{inset:-5% -18%;background-position:54% center;transform:translate3d(var(--x,0),var(--y,0),0) scale(1.06)}}@media(max-width:620px){.stage{min-height:690px}.scene{inset:-7% -54%;background-position:56% center}.badge{left:12px;bottom:10px;font-size:8px}.glass{width:16%}}@media(prefers-reduced-motion:reduce){.scene{transition:opacity .25s;transform:scale(1.045)!important}.glass{animation:none}}</style></head><body><main class="stage" id="stage"><div class="load">Loading cinematic review</div><div class="scene" id="scene"></div><div class="glass g1"></div><div class="glass g2"></div><div class="edge"></div><div class="badge">isolated visual review · no legacy assets</div></main><script>(async()=>{const n=9,parts=[];for(let i=0;i<n;i++){parts.push(await fetch(`hero/${String(i).padStart(2,'0')}.txt?v=2`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))}const stage=document.getElementById('stage'),scene=document.getElementById('scene');scene.style.backgroundImage=`url(data:image/webp;base64,${parts.join('')})`;stage.classList.add('loaded');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let tx=0,ty=0,x=0,y=0;function tick(){x+=(tx-x)*.065;y+=(ty-y)*.065;scene.style.setProperty('--x',x.toFixed(2)+'px');scene.style.setProperty('--y',y.toFixed(2)+'px');requestAnimationFrame(tick)}tick();addEventListener('pointermove',e=>{tx=((e.clientX/innerWidth)-.5)*-20;ty=((e.clientY/innerHeight)-.5)*-12},{passive:true});if('DeviceOrientationEvent'in window)addEventListener('deviceorientation',e=>{if(e.gamma==null||e.beta==null)return;tx=Math.max(-16,Math.min(16,e.gamma*.35));ty=Math.max(-10,Math.min(10,(e.beta-45)*.16))},{passive:true})})().catch(()=>document.querySelector('.load').textContent='Preview asset failed to load');</script></body></html>
