name: ci
on:
  pull_request:
  push: { branches: [main, feat/astro-production-migration] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    # Secrets cannot be used directly in `if:` conditionals (GitHub docs);
    # expose a boolean via job-level env and let steps reference that.
    env:
      FIREBASE_DEPLOY_ENABLED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npx vitest run
      - run: npm run build
      - name: Functions typecheck (own package)
        run: |
          cd functions
          npm ci
          npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Lighthouse budget
        run: |
          npm run preview -- --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4321
          npx lhci autorun
      - name: Deploy preview (PR) / prod (main)
        if: ${{ env.FIREBASE_DEPLOY_ENABLED == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || github.head_ref }}
