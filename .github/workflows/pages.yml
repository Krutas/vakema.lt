name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static site: publish only the site files (not docs/, tools/).
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js robots.txt sitemap.xml js assets langai durys montavimas _site/

      # "Mūsų darbai": every photo in gallery/ is resized (WebP + thumbnail) and listed in
      # _site/gallery/gallery.json, so adding a photo to the folder is all it takes.
      - name: Build gallery
        run: |
          # The runner image has no image tools: ImageMagick does the resizing
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick > /dev/null
          node tools/gallery.mjs --out _site/gallery

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
